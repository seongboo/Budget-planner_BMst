<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>식비 가계부</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#2563eb">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --tx:#1c1f24; --sub:#6b7280; --ok:#0f9d58; --bad:#d93025; --ac:#2563eb; --bd:#e5e7eb; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Noto Sans KR",sans-serif; background:var(--bg); color:var(--tx); }
  main { max-width:520px; margin:0 auto; padding:12px; }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:14px; margin-bottom:12px; }
  h2 { font-size:15px; margin:0 0 10px; }
  .big { font-size:28px; font-weight:700; }
  .row { display:flex; gap:8px; align-items:center; margin:6px 0; }
  .row > * { flex:1; }
  label { font-size:13px; color:var(--sub); }
  input, select, button { font:inherit; padding:9px; border:1px solid var(--bd); border-radius:8px; width:100%; background:#fff; }
  button { background:var(--ac); color:#fff; border:none; cursor:pointer; }
  button.ghost { background:#fff; color:var(--tx); border:1px solid var(--bd); }
  button.sm { width:auto; padding:4px 10px; font-size:12px; }
  .pos { color:var(--ok); } .neg { color:var(--bad); }
  .sub { font-size:13px; color:var(--sub); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td { padding:6px 4px; border-bottom:1px solid var(--bd); }
  .fixed-row { flex-wrap:wrap; }
  .fixed-row > input:first-child { flex:1 1 100%; }
  .fixed-row .amt { flex:1 1 0; min-width:140px; }
  .fixed-row button.sm { flex:0 0 auto; padding:10px 14px; }
  .fixed-row .amt input { font-size:16px; padding:11px 28px 11px 9px; }
  .item, .fixed-item { background:#f4f6fa; border:1px solid #cfd6e0; border-left:4px solid var(--ac); border-radius:10px; padding:8px; margin-bottom:12px; }
  .item .row, .fixed-item .row { margin:6px 0; }
  .item input, .fixed-item input { background:#fff; }
  textarea.memo { background:#fff !important; }
  .sec { font-size:14px; font-weight:700; margin:20px 0 10px; padding-top:14px; border-top:2px solid var(--bd); }
  .sec.first { margin-top:4px; padding-top:0; border-top:none; }
  .sec .sub { font-weight:400; margin-left:6px; }
  textarea.memo { width:100%; font:inherit; font-size:13px; padding:8px; border:1px solid var(--bd); border-radius:8px; resize:vertical; background:#fafafa; }
  main { padding-bottom:76px; }
  section[hidden] { display:none; }
  #tabs { position:fixed; left:0; right:0; bottom:0; display:flex; background:#fff; border-top:1px solid var(--bd); padding-bottom:env(safe-area-inset-bottom); }
  #tabs button { flex:1; background:#fff; color:var(--sub); border:none; border-radius:0; padding:14px 0; font-weight:600; }
  #tabs button.on { color:var(--ac); box-shadow:inset 0 2px 0 var(--ac); }
  .warn { color:var(--bad); font-size:13px; }
  .amt { position:relative; flex:1; display:block; }
  .amt input { text-align:right; padding-right:28px; }
  .amt::after { content:'원'; position:absolute; right:10px; top:50%; transform:translateY(-50%); color:var(--sub); font-size:13px; pointer-events:none; }
</style>
</head>
<body>
<main>

<section id="pg-home">
<div class="card" id="today">
  <h2>오늘</h2>
  <div class="sub">오늘 남은 허용 식비</div>
  <div class="big" id="todayLeft">-</div>
  <div class="sub" id="todayDetail"></div>
  <hr style="border:0;border-top:1px solid var(--bd);margin:12px 0">
  <div class="sub">누적 세이브 잔액 (어제까지)</div>
  <div class="big" id="saveB">-</div>
  <div class="sub" id="hint"></div>
  <hr style="border:0;border-top:1px solid var(--bd);margin:12px 0">
  <div class="sub">이번 달 남는 돈 (수입 − 고정지출 − 식비 예산)</div>
  <div class="big" id="leftover">-</div>
  <div class="sub" id="leftoverDetail"></div>
</div>

<div class="card">
  <h2>지출 입력</h2>
  <div class="row"><label>날짜</label><input type="date" id="eDate"></div>
  <div class="row">
    <select id="eType">
      <option value="food">식비 (외식·배달·장보기)</option>
      <option value="big">큰 지출</option>
      <option value="fixed">고정지출 결제</option>
    </select>
    <span class="amt"><input type="text" id="eAmt" class="money" placeholder="금액" inputmode="numeric"></span>
  </div>
  <div class="row" id="fixedRow" style="display:none"><select id="eFixed"></select></div>
  <div class="warn" id="eWarn"></div>
  <div class="row" id="quick">
    <button type="button" class="ghost" data-add="1000">+1천</button>
    <button type="button" class="ghost" data-add="5000">+5천</button>
    <button type="button" class="ghost" data-add="10000">+1만</button>
    <button type="button" class="ghost" data-add="50000">+5만</button>
  </div>
  <div class="row" id="modeRow" style="display:none">
    <select id="eMode">
      <option value="carry">잔액에서 차감 (B에서 뺌)</option>
      <option value="split">남은 날에 균등 분할 (하루 허용액 감소)</option>
    </select>
  </div>
  <div class="row"><input type="text" id="eMemo" placeholder="메모(선택)"></div>
  <div class="row"><button id="addBtn">추가</button></div>
  <div class="sub">집밥을 먹은 날은 아무것도 입력하지 않으면 됩니다. 그날 허용액이 전부 세이브로 쌓입니다.</div>
</div>

<div class="card">
  <h2>내역</h2>
  <table id="log"></table>
</div>

</section>
<section id="pg-set" hidden>
<div class="card">
  <h2>설정</h2>
  <div class="sec first">고정 수입 <span class="sub">항목명 · 금액 · 입금일</span></div>
  <div id="incomeList"></div>
  <div class="row"><button class="ghost" id="addIncome">+ 수입 항목 추가</button></div>
  <div class="sec">고정 지출 <span class="sub">항목명 · 금액 · 메모</span></div>
  <div id="fixedList"></div>
  <div class="row"><button class="ghost" id="addFixed">+ 고정지출 항목 추가</button></div>
  <div class="sec">식비 · 기타</div>
  <div class="row"><label>월 식비 예산</label><span class="amt"><input type="text" id="food" class="money" inputmode="numeric"></span></div>
  <div class="row"><label>추적 시작일</label><input type="date" id="start"></div>
  <div class="sub" id="calc"></div>
  <div class="warn" id="warn"></div>
</div>

<div class="card">
  <h2>오늘 요약 내보내기</h2>
  <div class="row">
    <button id="shareBtn">공유 (삼성 노트 선택)</button>
    <button class="ghost" id="copyBtn">텍스트 복사</button>
  </div>
  <div class="sub" id="shareMsg"></div>
</div>

<div class="card">
  <h2>백업</h2>
  <div class="row">
    <button class="ghost" id="exp">JSON 내보내기</button>
    <button class="ghost" id="impBtn">가져오기</button>
  </div>
  <input type="file" id="imp" accept="application/json" style="display:none">
  <div class="sub">데이터는 이 브라우저에만 저장됩니다. 브라우저 데이터를 지우면 사라지므로 가끔 내보내기를 하세요.</div>
</div>

</section>
</main>
<nav id="tabs"><button type="button" data-pg="home" class="on">홈</button><button type="button" data-pg="set">설정</button></nav>

<script>
/* ===== 순수 계산 로직 (BEGIN) ===== */
function ymd(d){ const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function parse(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function dim(y,m){ return new Date(y,m+1,0).getDate(); }            // m: 0-based
function addDays(d,k){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()+k); }

/* 날짜 d의 기본 허용액 a_d = M / N(해당 월 일수) */
function baseAllowance(M,d){ return M/dim(d.getFullYear(),d.getMonth()); }

/* 분할 지출 X를 날짜 e에 입력하면, e부터 월말까지 R일에 걸쳐 하루 X/R씩 허용액 감소 */
function splitShare(entry,d){
  const e=parse(entry.date);
  if(e.getFullYear()!==d.getFullYear()||e.getMonth()!==d.getMonth()||d<e) return 0;
  const R=dim(e.getFullYear(),e.getMonth())-e.getDate()+1;
  return entry.amount/R;
}

/* 하루의 순증감: a_d - split분 - 식비 - 잔액차감 큰지출 */
function dayNet(st,d){
  const key=ymd(d);
  let net=baseAllowance(st.food,d);
  for(const e of st.entries){
    if(e.type==='big' && e.mode==='split') net-=splitShare(e,d);
    if(e.date!==key) continue;
    if(e.type==='food') net-=e.amount;
    else if(e.type==='big' && e.mode==='carry') net-=e.amount;
  }
  return net;
}
/* 오늘 직전까지 누적 B, 오늘 남은 허용액 */
function compute(st,today){
  const s=parse(st.start); let B=0;
  for(let d=s; d<today; d=addDays(d,1)) B+=dayNet(st,d);
  const left = today>=s ? dayNet(st,today) : 0;
  const R = dim(today.getFullYear(),today.getMonth())-today.getDate()+1;
  return {B, left, R, a:baseAllowance(st.food,today)};
}
/* 해당 월의 고정지출 절약분: 같은 달·같은 항목은 마지막 입력만 반영, 차이 = 예산(planned) - 실제 */
function fixedSaving(st,today){
  const y=today.getFullYear(), m=today.getMonth(), last={};
  st.entries.forEach((e,idx)=>{
    if(e.type!=='fixed') return;
    const d=parse(e.date); if(d.getFullYear()!==y||d.getMonth()!==m) return;
    const k=e.fid||e.name, prev=last[k];
    if(!prev || e.date>prev.e.date || (e.date===prev.e.date && idx>prev.idx)) last[k]={e,idx};
  });
  return Object.values(last).reduce((sum,{e})=>sum+(e.planned-e.amount),0);
}
/* ===== 순수 계산 로직 (END) ===== */

const KEY='foodbudget.v1';
const num=s=>+String(s).replace(/[^0-9]/g,'')||0;           // 쉼표 등 제거 후 정수
const fmt=n=>n?Number(n).toLocaleString('ko-KR'):'';          // 15000 -> '15,000'
document.addEventListener('input',e=>{ if(e.target.classList&&e.target.classList.contains('money')) e.target.value=fmt(num(e.target.value)); });
let st=JSON.parse(localStorage.getItem(KEY)||'null')||{incomes:[],fixed:[],food:0,start:ymd(new Date()),entries:[]};
function migrate(){ // 단일 income -> incomes 목록
  if(!st.incomes){ st.incomes = st.income>0 ? [{name:'수입',amount:st.income,day:''}] : []; }
  delete st.income;
  st.fixed.forEach(f=>{ if(!f.id) f.id='f'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); });
}
migrate();
const $=id=>document.getElementById(id);
const won=n=>(n<0?'-':'')+Math.round(Math.abs(n)).toLocaleString('ko-KR')+'원';
const save=()=>{localStorage.setItem(KEY,JSON.stringify(st));render();};

function render(){
  const today=new Date(); const c=compute(st,new Date(today.getFullYear(),today.getMonth(),today.getDate()));
  $('todayLeft').textContent=won(c.left); $('todayLeft').className='big '+(c.left>=0?'pos':'neg');
  $('todayDetail').textContent='기본 하루 허용액 '+won(c.a);
  $('saveB').textContent=won(c.B); $('saveB').className='big '+(c.B>=0?'pos':'neg');
  const tot=c.B+c.left;
  $('hint').textContent = tot<0
    ? '오늘 포함 남은 '+c.R+'일 동안 하루 '+won(c.a+tot/c.R)+'만 쓰면 이 달 안에 회복돼요.'
    : '오늘까지 모두 반영한 합계: '+won(tot);

  const fixedSum=st.fixed.reduce((s,f)=>s+(+f.amount||0),0);
  const incomeSum=st.incomes.reduce((s,f)=>s+(+f.amount||0),0);
  const rest=incomeSum-fixedSum;
  const fsave=fixedSaving(st,new Date(today.getFullYear(),today.getMonth(),today.getDate()));
  const leftover=incomeSum-fixedSum-st.food+fsave;
  $('leftover').textContent=won(leftover); $('leftover').className='big '+(leftover>=0?'pos':'neg');
  $('leftoverDetail').textContent = incomeSum>0
    ? (leftover<0 ? '예산 초과: 수입보다 지출·식비 예산이 '+won(-leftover)+' 많습니다.' : '수입 '+won(incomeSum)+' − 고정지출 '+won(fixedSum)+' − 식비 예산 '+won(st.food)+(fsave?' '+(fsave>0?'+':'−')+' 고정지출 절약분 '+won(Math.abs(fsave)):''))
    : '수입 항목을 입력하면 계산됩니다.';
  $('calc').textContent='수입 '+won(incomeSum)+' − 고정지출 '+won(fixedSum)+' = '+won(rest)+' (식비 예산 제외 전)';
  $('warn').textContent = st.food>rest && incomeSum>0 ? '식비 예산이 (수입 − 고정지출)보다 큽니다.' : '';

  $('incomeList').innerHTML='';
  st.incomes.forEach((f,i)=>{
    const r=document.createElement('div'); r.className='row fixed-row';
    r.innerHTML='<input placeholder="항목" value="'+f.name.replace(/"/g,'&quot;')+'"><span class="amt"><input type="text" class="money" inputmode="numeric" placeholder="금액" value="'+fmt(f.amount)+'"></span><input type="number" inputmode="numeric" min="1" max="31" placeholder="일" value="'+(f.day||'')+'" style="max-width:64px"><button class="ghost sm">삭제</button>';
    const [n,aw,d,b]=r.children; const a=aw.firstChild;
    n.onchange=()=>{st.incomes[i].name=n.value;save();};
    a.onchange=()=>{st.incomes[i].amount=num(a.value);save();};
    d.onchange=()=>{st.incomes[i].day=d.value;save();};
    b.onclick=()=>{st.incomes.splice(i,1);save();};
    const w=document.createElement('div'); w.className='item'; w.appendChild(r);
    $('incomeList').appendChild(w);
  });

  $('fixedList').innerHTML='';
  st.fixed.forEach((f,i)=>{
    const r=document.createElement('div'); r.className='row fixed-row';
    r.innerHTML='<input placeholder="항목" value="'+f.name.replace(/"/g,'&quot;')+'"><span class="amt"><input type="text" class="money" inputmode="numeric" value="'+fmt(f.amount)+'"></span><button class="ghost sm">삭제</button>';
    const [n,aw,b]=r.children; const a=aw.firstChild;
    n.onchange=()=>{st.fixed[i].name=n.value;save();};
    a.onchange=()=>{st.fixed[i].amount=num(a.value);save();};
    b.onclick=()=>{st.fixed.splice(i,1);save();};
    const memo=document.createElement('textarea'); memo.className='memo'; memo.rows=2;
    memo.placeholder='메모 (예: 넷플릭스 17,000 / 유튜브 14,900)'; memo.value=f.memo||'';
    memo.onchange=()=>{st.fixed[i].memo=memo.value;save();};
    const wrap=document.createElement('div'); wrap.className='fixed-item';
    wrap.appendChild(r); wrap.appendChild(memo);
    $('fixedList').appendChild(wrap);
  });

  const sel=$('eFixed'), keep=sel.value;
  sel.innerHTML=st.fixed.map(f=>'<option value="'+f.id+'">'+((f.name||'(이름 없음)').replace(/</g,'&lt;'))+' (예산 '+won(f.amount)+')</option>').join('');
  if(keep) sel.value=keep;
  const rows=[...st.entries].map((e,i)=>({e,i})).sort((x,y)=>y.e.date.localeCompare(x.e.date));
  $('log').innerHTML=rows.map(({e,i})=>'<tr><td>'+e.date.slice(5)+'</td><td>'+(e.type==='food'?'식비':e.type==='fixed'?'고정('+(e.name||'')+')':'큰지출('+(e.mode==='carry'?'차감':'분할')+')')+'</td><td>'+(e.memo||'')+(e.type==='fixed'?' <span class="sub">예산 '+won(e.planned)+' → '+((e.planned-e.amount)>=0?'+':'')+won(e.planned-e.amount)+'</span>':'')+'</td><td style="text-align:right">'+won(e.amount)+'</td><td><button class="ghost sm" data-i="'+i+'">삭제</button></td></tr>').join('')||'<tr><td class="sub">내역 없음</td></tr>';
  $('log').querySelectorAll('button').forEach(b=>b.onclick=()=>{st.entries.splice(+b.dataset.i,1);save();});
}

$('food').value=fmt(st.food); $('start').value=st.start; $('eDate').value=ymd(new Date());
$('addIncome').onclick=()=>{st.incomes.push({name:'',amount:0,day:''});save();};
$('food').onchange=e=>{st.food=num(e.target.value);save();};
$('start').onchange=e=>{st.start=e.target.value;save();};
$('addFixed').onclick=()=>{st.fixed.push({id:'f'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:'',amount:0,memo:''});save();};
function applyType(){
  const t=$('eType').value;
  $('modeRow').style.display=t==='big'?'flex':'none';
  $('fixedRow').style.display=t==='fixed'?'flex':'none';
  $('eWarn').textContent='';
  if(t==='fixed') prefillFixed();
}
function prefillFixed(){ const f=st.fixed.find(x=>x.id===$('eFixed').value); if(f && !num($('eAmt').value)) $('eAmt').value=fmt(f.amount); }
$('eType').onchange=applyType;
$('eFixed').onchange=()=>{ const f=st.fixed.find(x=>x.id===$('eFixed').value); if(f) $('eAmt').value=fmt(f.amount); };
document.querySelectorAll('#quick button').forEach(b=>b.onclick=()=>{ $('eAmt').value=fmt(num($('eAmt').value)+(+b.dataset.add)); });
$('addBtn').onclick=()=>{
  const amt=num($('eAmt').value); if(!(amt>0)||!$('eDate').value) return;
  const type=$('eType').value;
  if(type==='fixed'){
    const f=st.fixed.find(x=>x.id===$('eFixed').value);
    if(!f){ $('eWarn').textContent='설정 탭에 고정지출 항목을 먼저 등록하세요.'; return; }
    st.entries.push({date:$('eDate').value,type:'fixed',fid:f.id,name:f.name,planned:+f.amount||0,amount:amt,mode:null,memo:$('eMemo').value});
  } else {
    st.entries.push({date:$('eDate').value,type,amount:amt,mode:type==='big'?$('eMode').value:null,memo:$('eMemo').value});
  }
  $('eAmt').value=''; $('eMemo').value=''; save();
};
function summaryText(){
  const t=new Date(); const today=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  const c=compute(st,today), key=ymd(today);
  const food=st.entries.filter(e=>e.date===key&&e.type==='food').reduce((s,e)=>s+e.amount,0);
  const big=st.entries.filter(e=>e.date===key&&e.type==='big');
  const L=['[식비 가계부] '+key,
    '기본 하루 허용액: '+won(c.a),
    '오늘 식비 지출: '+won(food)];
  big.forEach(e=>L.push('큰 지출('+(e.mode==='carry'?'잔액 차감':'분할')+'): '+won(e.amount)+(e.memo?' - '+e.memo:'')));
  L.push('오늘 남은 허용액: '+won(c.left),
    '누적 세이브(어제까지): '+won(c.B),
    '합계(오늘 반영): '+won(c.B+c.left));
  return L.join('\n');
}
$('copyBtn').onclick=async()=>{
  try{ await navigator.clipboard.writeText(summaryText()); $('shareMsg').textContent='복사됨. 삼성 노트에 붙여넣으세요.'; }
  catch(_){ $('shareMsg').textContent='복사 실패. 이 브라우저는 클립보드 접근을 막고 있습니다.'; }
};
$('shareBtn').onclick=async()=>{
  if(!navigator.share){ $('shareMsg').textContent='이 브라우저는 공유를 지원하지 않습니다. "텍스트 복사"를 사용하세요.'; return; }
  try{ await navigator.share({title:'식비 가계부',text:summaryText()}); $('shareMsg').textContent=''; }
  catch(e){ if(e.name!=='AbortError') $('shareMsg').textContent='공유 실패. "텍스트 복사"를 사용하세요.'; }
};
$('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(st,null,1)],{type:'application/json'}));a.download='foodbudget-'+ymd(new Date())+'.json';a.click();};
$('impBtn').onclick=()=>$('imp').click();
$('imp').onchange=e=>{const f=e.target.files[0]; if(!f) return; f.text().then(t=>{try{st=JSON.parse(t);migrate();$('food').value=fmt(st.food);$('start').value=st.start;save();}catch(_){alert('올바른 JSON이 아닙니다.');}});};
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
  const pg=b.dataset.pg;
  $('pg-home').hidden = pg!=='home'; $('pg-set').hidden = pg!=='set';
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  window.scrollTo(0,0);
});
render();
</script>
</body>
</html>
